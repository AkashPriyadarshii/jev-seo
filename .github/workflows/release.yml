name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            bin_name: jev-seo
            archive_ext: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            bin_name: jev-seo
            archive_ext: tar.gz
            use_cross: true
          - target: aarch64-apple-darwin
            os: macos-latest
            bin_name: jev-seo
            archive_ext: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bin_name: jev-seo.exe
            archive_ext: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Cross (if cross-compiling Linux ARM64)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build Release Binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} --bin jev-seo
          else
            cargo build --release --target ${{ matrix.target }} --bin jev-seo
          fi
        shell: bash

      - name: Package Binary (Unix)
        if: runner.os != 'Windows'
        run: |
          BIN="target/${{ matrix.target }}/release/${{ matrix.bin_name }}"
          strip "$BIN" 2>/dev/null || true
          ARCHIVE="jev-seo-${{ matrix.target }}.tar.gz"
          tar -czf "$ARCHIVE" -C "target/${{ matrix.target }}/release" "${{ matrix.bin_name }}"
          shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
        shell: bash

      - name: Package Binary (Windows)
        if: runner.os == 'Windows'
        run: |
          $bin = "target/${{ matrix.target }}/release/${{ matrix.bin_name }}"
          $archive = "jev-seo-${{ matrix.target }}.zip"
          Compress-Archive -Path $bin -DestinationPath $archive
          $hash = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLower()
          "$hash  $archive" | Out-File -FilePath "$archive.sha256" -Encoding ASCII
        shell: pwsh

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            jev-seo-${{ matrix.target }}.*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-crate:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: build-release
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish crate
        run: |
          set +e
          cargo publish --locked 2>&1 | tee /tmp/cargo-publish.log
          status=${PIPESTATUS[0]}
          if [ $status -eq 0 ]; then exit 0; fi
          if grep -q "already exists on crates.io" /tmp/cargo-publish.log; then
            echo "crate already published, treating as success"
            exit 0
          fi
          cat /tmp/cargo-publish.log
          exit $status
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  deploy-deplexo:
    name: Deploy to Deplexo
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-release
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Deplexo
        run: |
          set -e
          if [ -z "${{ secrets.DEPLEXO_API_KEY }}" ]; then echo "DEPLEXO_API_KEY not set, skipping"; exit 0; fi
          # Deplexo API: trigger deploy via git-linked app or POST to /api/deploy
          # Tries documented endpoint first, falls back to no-op success so release does not fail
          curl -fsS -X POST https://api.deplexo.com/v1/deploy \
            -H "Authorization: Bearer ${{ secrets.DEPLEXO_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"repo":"AkashPriyadarshii/jev-seo","branch":"master"}' \
            && echo "deplexo deploy triggered" || echo "deplexo deploy skipped (app not yet linked in dashboard — connect jev-seo repo at https://deplexo.com once)"
