name: secret-scan
on: [push, pull_request]
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: credential pattern sweep
        run: |
          set -euo pipefail
          # High-signal credential patterns over tracked files. Quoted values
          # are matched prefix-only so shell quoting stays trivial. Test
          # fixtures and example placeholders stay excluded below.
          PATTERN='AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{36,}|sk-(live|test)-[A-Za-z0-9]{16,}|xox[bpas]-[A-Za-z0-9-]+|tvly-[A-Za-z0-9_-]{10,}|fc-[A-Za-z0-9]{10,}'
          hits=$(git ls-files | grep -v -E '^(tests/fixtures/|examples/audit-good|.*\.lock$)' | xargs -r grep -n -E -i "$PATTERN" || true)
          # Filter documented placeholders and env-var *reads* (no values).
          hits=$(printf '%s' "$hits" | grep -v -E 'YOUR_|EXAMPLE|DUMMY|REDACTED|placeholder|getenv|std::env::var|process\.env' || true)
          if [ -n "$hits" ]; then
            printf 'possible committed secret:\n%s\n' "$hits"
            exit 1
          fi
          echo "secret scan clean"
